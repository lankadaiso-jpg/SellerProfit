
name: Build SellerProfit APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract project
        run: |
          unzip -o SellerProfit_Advanced_Release_Fixed.zip -d .
          test -f SellerProfit/pubspec.yaml

      - name: Prepare Android project
        working-directory: SellerProfit
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android .
          fi
          find . -path '*/build.gradle' -o -path '*/build.gradle.kts' | while read file; do
            sed -i 's/flutter.compileSdkVersion/36/g' "$file"
            sed -i 's/compileSdkVersion 34/compileSdkVersion 36/g' "$file"
            sed -i 's/compileSdk = 34/compileSdk = 36/g' "$file"
          done
          grep -R "compileSdk" android

      - name: Install packages
        working-directory: SellerProfit
        run: flutter pub get

      - name: Run tests
        working-directory: SellerProfit
        run: flutter test test/profit_calculator_test.dart
      - name: Build APK
        working-directory: SellerProfit
        run: flutter build apk --release

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: SellerProfit-APK
          path: SellerProfit/build/app/outputs/flutter-apk/app-release.apk
          
